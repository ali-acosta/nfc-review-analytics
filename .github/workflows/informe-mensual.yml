# Envía el informe mensual a todos los clientes.
#
# GitHub Actions es gratis y basta para esto: una corrida al mes, un par de
# minutos. Se eligió por sobre un cron del hosting porque aquí sí hay permisos
# para instalar las librerías nativas que WeasyPrint necesita, así el PDF se
# puede adjuntar aunque el servidor de la app no pueda generarlo.
#
# Requiere configurar en Settings → Secrets: DATABASE_URL, BASE_URL,
# SMTP_HOST, SMTP_USER, SMTP_PASSWORD, SMTP_FROM y, si se usa, TELEGRAM_BOT_TOKEN. Con la base en SQLite esto no funciona: necesita el
# Postgres gestionado, que es accesible desde fuera del servidor.

name: Informe mensual

on:
  schedule:
    # Día 1 de cada mes, 13:00 UTC (09:00 en Chile continental).
    - cron: "0 13 1 * *"
  workflow_dispatch:
    inputs:
      mes:
        description: "Período AAAA-MM (vacío = último mes completo)"
        required: false
      dry_run:
        description: "Solo mostrar, sin enviar"
        type: boolean
        default: false

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Librerías nativas para el PDF
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0

      - name: Dependencias
        run: |
          pip install -r requirements.txt
          pip install weasyprint

      - name: Enviar
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BASE_URL: ${{ secrets.BASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # El correo es el canal principal: un dueño de pyme lo revisa a diario y
          # puede no tener Telegram. Sin estas cuatro, send_email se saltaba el
          # envío en silencio y el job terminaba en rojo para cada cliente que
          # solo tuviera correo.
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: |
          python -m scripts.send_reports \
            ${{ inputs.mes && format('--mes {0}', inputs.mes) || '' }} \
            ${{ inputs.dry_run && '--dry-run' || '' }}
