# Respaldo semanal de los datos de todos los clientes.
#
# El historial de toques de un cliente es irreemplazable: no se puede volver a
# generar, porque son personas que pasaron por su local y ya no están. Neon en su
# plan gratuito tiene recuperación limitada en el tiempo, así que un borrado
# accidental o una base perdida se lleva meses de datos con los que además se
# arma la facturación.
#
# Desde el programa de sellos también se lleva los sellos y los premios, que son
# peores de perder que el historial: no es un número que le falte al dueño, es un
# cliente que ya juntó los suyos parado en el mostrador mientras el sistema le
# dice que no tiene nada.
#
# Se guarda como artifact de GitHub, que retiene 90 días sin costo. No reemplaza
# a un respaldo de la base entera, pero cubre lo que de verdad no se puede
# reconstruir: las visitas, las quejas y los sellos.

name: Respaldo semanal

on:
  schedule:
    # Domingos a las 06:00 UTC (02:00 en Chile continental), cuando no hay
    # tráfico en los locales.
    - cron: "0 6 * * 0"
  workflow_dispatch:

jobs:
  respaldar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Exportar los datos de todos los clientes
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m scripts.export_data --todos --destino respaldo

      - name: Guardar el respaldo
        uses: actions/upload-artifact@v4
        with:
          name: respaldo-${{ github.run_id }}
          path: respaldo/
          retention-days: 90

      - name: Resumen
        run: |
          echo "### Respaldo completado" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          ls -la respaldo/ | tail -n +2 | awk '{print "- " $9 " (" $5 " bytes)"}' >> $GITHUB_STEP_SUMMARY
