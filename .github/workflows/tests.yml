# Corre la suite en cada push y pull request.
#
# Los tests protegen sobre todo dos cosas: que la métrica de conversión siga
# siendo correcta (ya se rompió una vez, en silencio) y que no se reintroduzca
# el filtrado de reseñas que viola las políticas de Google.

name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements-dev.txt

      - run: pytest -q
