# Configuración de Alembic.
#
# Ojo: la URL de la base NO se escribe aquí. migrations/env.py la toma de
# app.config.settings, que lee DATABASE_URL del entorno o del .env. Así las
# migraciones apuntan siempre a la misma base que la aplicación, y no hay
# credenciales de producción escritas en el repositorio.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
