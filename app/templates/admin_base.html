<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>{% block titulo %}Administración{% endblock %}</title>
  <link rel="stylesheet" href="/static/admin.css" />
</head>
<body class="admin">
  <header class="barra">
    <a class="marca" href="/admin/">Administración</a>
    <form method="post" action="/admin/logout" class="salir">
      <button type="submit" class="btn-texto">Cerrar sesión</button>
    </form>
  </header>

  <main class="contenido">
    {% block contenido %}{% endblock %}
  </main>
</body>
</html>
