<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Gracias — {{ business.name }}</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main class="card">
    {% if tiene_logo %}
    <img class="logo" src="/r/{{ placement.token }}/logo.png" alt="{{ business.name }}" />
    {% endif %}
    <h1>¡Gracias!</h1>
    <p class="subtitle">
      Tu comentario fue enviado directamente al equipo de {{ business.name }}.
      Si más adelante quieres dejar también tu reseña pública en Google, siempre puedes hacerlo aquí:
    </p>
    <!-- Pasa por /go, no directo a Google: si no, esta conversión no se cuenta y
         el cliente ve en su informe menos reseñas de las que realmente generó. -->
    <a class="btn btn-primary" href="/r/{{ placement.token }}/go">Dejar reseña en Google</a>
  </main>
</body>
</html>
