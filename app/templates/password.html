<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cambiar contraseña</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main class="card">
    <h1>Cambiar contraseña</h1>

    {% if ok %}
    <p class="form-ok" role="status">Listo, tu contraseña quedó cambiada.</p>
    <a class="btn btn-primary" href="/dashboard/">Volver al panel</a>
    {% else %}
    <p class="subtitle">Elige una clave que recuerdes: nadie puede recuperarla por ti.</p>

    {% if error %}
    <p class="form-error" role="alert">{{ error }}</p>
    {% endif %}

    <form method="post" action="/panel/password" class="login-form">
      <label>
        Contraseña actual
        <input type="password" name="actual" autocomplete="current-password" required autofocus />
      </label>
      <label>
        Contraseña nueva
        <input type="password" name="nueva" autocomplete="new-password" minlength="8" required />
      </label>
      <label>
        Repite la nueva
        <input type="password" name="repetir" autocomplete="new-password" minlength="8" required />
      </label>
      <button type="submit" class="btn btn-primary">Cambiar</button>
    </form>
    <a class="link-secondary" href="/dashboard/">Volver al panel</a>
    {% endif %}
  </main>
</body>
</html>
